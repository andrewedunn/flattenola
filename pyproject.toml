[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flattenola"
version = "1.0.0"
description = "Flatten NOLA: the flattest walk or ride across New Orleans, adapted from Flatten SF"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "shapely>=2.0",
    "pyproj>=3.5",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "rtree>=1.0",
    "rasterio>=1.3",
    "networkx>=3.1",
    "pyarrow>=14",
    "fsspec>=2023.9",
    "aiohttp>=3.9",
    "requests>=2.31",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
flattenola = "nola_flat_routes.__main__:main"

[tool.setuptools.packages.find]
include = ["nola_flat_routes*"]

[tool.setuptools.package-data]
nola_flat_routes = ["web/*", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
